<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telecom Threat Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg:        #0A0E14;
    --panel:     #10151F;
    --panel-hi:  #161C29;
    --line:      #212938;
    --text:      #C7D0DC;
    --text-dim:  #5B6675;
    --green:     #26FFA8;
    --red:       #FF3B5C;
    --amber:     #FFB020;
    --mono: 'IBM Plex Mono', 'Consolas', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  /* faint scanline / grid texture behind everything */
  body {
    background-image:
      linear-gradient(rgba(38,255,168,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(38,255,168,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  /* ---- top status bar ---- */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 22px;
  }

  .statusbar .live {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--green);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.8s ease-in-out infinite;
  }

  .dot.down { background: var(--red); box-shadow: 0 0 8px var(--red); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ---- header ---- */
  header {
    margin-bottom: 26px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  h1 {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;
    color: #fff;
  }

  h1 span { color: var(--green); }

  /* ---- layout grid ---- */
  .grid {
    display: grid;
    grid-template-columns: 1.1fr 1.4fr;
    gap: 18px;
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
  }

  .panel h2 {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 16px;
    font-weight: 500;
  }

  /* ---- chart panel ---- */
  .chart-panel { display: flex; flex-direction: column; align-items: center; }
  .chart-shell { position: relative; width: 100%; max-width: 300px; }
  canvas#threatChart { width: 100% !important; height: auto !important; }

  .chart-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }
  .chart-center .num {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    color: #fff;
  }
  .chart-center .lbl {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  .legend-row {
    display: flex;
    gap: 22px;
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .legend-row .item { display: flex; align-items: center; gap: 7px; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; }

  /* ---- stat cards ---- */
  .stat-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .stat-card {
    background: var(--panel-hi);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }

  .stat-card .lbl {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .stat-card .val {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    color: #fff;
  }

  .stat-card.attack .val { color: var(--red); }
  .stat-card.normal .val { color: var(--green); }

  /* ---- error / empty state ---- */
  .state-msg {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    padding: 30px 10px;
    line-height: 1.6;
  }
  .state-msg .code { color: var(--red); }

  footer {
    margin-top: 22px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.05em;
  }
</style>
</head>

<body>
<div class="wrap">

  <div class="statusbar">
    <div class="live"><span class="dot" id="statusDot"></span><span id="statusText">LIVE — POLLING /stats/</span></div>
    <div id="clock">--:--:--</div>
  </div>

  <header>
    <div class="eyebrow">Network Anomaly Detector</div>
    <h1>Telecom Threat <span>Monitor</span></h1>
    <a href="/admin/" style="color:var(--text-dim); font-family:var(--mono); font-size:11px; text-decoration:none;">
  ADMIN →
</a>
  </header>

  <div class="grid">

    <section class="panel chart-panel">
      <h2>Traffic Classification</h2>
      <div class="chart-shell">
        <canvas id="threatChart" width="300" height="300"></canvas>
        <div class="chart-center" id="chartCenter">
          <div class="num" id="totalNum">—</div>
          <div class="lbl">TOTAL</div>
        </div>
      </div>
      <div class="legend-row">
        <div class="item"><span class="swatch" style="background:var(--green)"></span>Normal</div>
        <div class="item"><span class="swatch" style="background:var(--red)"></span>Attacks</div>
      </div>
      <div id="chartError" class="state-msg" style="display:none;"></div>
    </section>

    <section class="panel">
      <h2>Snapshot</h2>
      <div class="stat-cards">
        <div class="stat-card normal">
          <div class="lbl">Normal traffic</div>
          <div class="val" id="normalVal">—</div>
        </div>
        <div class="stat-card attack">
          <div class="lbl">Flagged attacks</div>
          <div class="val" id="attackVal">—</div>
        </div>
        <div class="stat-card">
          <div class="lbl">Attack ratio</div>
          <div class="val" id="ratioVal">—</div>
        </div>
        <div class="stat-card">
          <div class="lbl">Last update</div>
          <div class="val" id="lastUpdate" style="font-size:16px;">—</div>
        </div>
      </div>
    </section>

  </div>

  <footer>Auto-refreshing every 5s · source: /stats/</footer>
</div>

<script>
let chart;

function tickClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
}
setInterval(tickClock, 1000);
tickClock();

function setStatus(ok) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (ok) {
    dot.classList.remove('down');
    txt.textContent = 'LIVE — POLLING /stats/';
  } else {
    dot.classList.add('down');
    txt.textContent = 'CONNECTION LOST';
  }
}

async function fetchStats() {
  const response = await fetch('/stats/');
  if (!response.ok) {
    throw new Error('HTTP ' + response.status);
  }
  return response.json();
}

function renderChart(normal, attacks) {
  const ctx = document.getElementById('threatChart').getContext('2d');
  const data = { labels: ['Normal', 'Attacks'], datasets: [{
    data: [normal, attacks],
    backgroundColor: ['#26FFA8', '#FF3B5C'],
    borderColor: '#10151F',
    borderWidth: 3,
  }]};

  if (chart) {
    chart.data = data;
    chart.update();
  } else {
    chart = new Chart(ctx, {
      type: 'doughnut',
      data: data,
      options: {
        cutout: '72%',
        plugins: { legend: { display: false } },
        animation: { duration: 400 },
      }
    });
  }
}

function updateCards(normal, attacks) {
  const total = normal + attacks;
  const ratio = total > 0 ? ((attacks / total) * 100).toFixed(1) + '%' : '—';

  document.getElementById('totalNum').textContent = total.toLocaleString();
  document.getElementById('normalVal').textContent = normal.toLocaleString();
  document.getElementById('attackVal').textContent = attacks.toLocaleString();
  document.getElementById('ratioVal').textContent = ratio;
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('en-GB');
}

async function refresh() {
  const errBox = document.getElementById('chartError');
  try {
    const stats = await fetchStats();
    const normal = Number(stats.normal) || 0;
    const attacks = Number(stats.attacks) || 0;

    errBox.style.display = 'none';
    document.getElementById('threatChart').style.display = 'block';

    renderChart(normal, attacks);
    updateCards(normal, attacks);
    setStatus(true);
  } catch (err) {
    setStatus(false);
    document.getElementById('threatChart').style.display = 'none';
    errBox.style.display = 'block';
    errBox.innerHTML = 'FAILED TO REACH <span class="code">/stats/</span><br>' + err.message;
  }
}

// poll every 5s — no full page reload, so chart updates smoothly
refresh();
setInterval(refresh, 5000);
</script>

</body>
</html>
